version: "3.9"

services:
  proctoring-api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # model files — read-only mount so the container cannot modify them
      - ./app/models:/app/app/models:ro
      # Persistent log storage
      - ./logs:/app/logs
      # Persistent upload storage
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
